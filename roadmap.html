  ===================== EDIT YOUR ROADMAP HERE =====================
  Each line is one item:  {title:"...", note:"...", status:"..."}
  status can be:  "doing"   = In progress
                  "planned" = Planned
                  "done"    = Done
  Add a new line, change a status to move it, or delete a line.
  Keep the comma at the end of each line (except it is fine on the last one too).
  Lines starting with // are turned off.
  ==================================================================
-->
<script>
var ROADMAP = [
  {title:"Beanbound released on iOS", note:"Free, no ads.", status:"done"},
  {title:"LokeWorks website launched", note:"Projects, assets, socials and more.", status:"done"},
  // {title:"Something I am building", note:"A short line about it.", status:"doing"},
  // {title:"Something coming later", note:"A short line about it.", status:"planned"},
];
</script>

<h2>Roadmap</h2>
<p class="sub">What I’m working on, what’s next, and what’s done.</p>
<div class="road" id="road"></div>
</section></main>
<script>
(function(){
  var cols=[["doing","In progress"],["planned","Planned"],["done","Done"]];
  var root=document.getElementById("road");
  cols.forEach(function(c){
    var items=ROADMAP.filter(function(r){return r.status===c[0];});
    var col=document.createElement("div");col.className="road-col road-"+c[0];
    var h=document.createElement("h3");h.textContent=c[1];
    var n=document.createElement("span");n.className="road-count";n.textContent=items.length;h.appendChild(n);
    col.appendChild(h);
    if(!items.length){var p=document.createElement("p");p.className="road-empty";p.textContent="Nothing here yet.";col.appendChild(p);}
    items.forEach(function(r){
      var card=document.createElement("div");card.className="road-card";
      var t=document.createElement("strong");t.textContent=r.title;card.appendChild(t);
      if(r.note){var d=document.createElement("p");d.textContent=r.note;card.appendChild(d);}
      col.appendChild(card);
    });
    root.appendChild(col);
  });
})();
</script></body></html>
