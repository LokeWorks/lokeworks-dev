<!DOCTYPE html>
<html lang="en"><head><!--
  ===================== EDIT YOUR ROADMAP HERE =====================
  Each line is one item:  {title:"...", note:"...", status:"..."}
  status can be:  "doing"   = In progress
                  "planned" = Planned
                  "done"    = Done
  Add a new line, change a status to move it, or delete a line.
  Keep the comma at the end of each line (except it is fine on the last one too).
  Lines starting with // are turned off.
  Scroll down to UNLOCKS for finished things that wait for a goal.
  ==================================================================
-->
<script>
var ROADMAP = [
  {title:"Beanbound released on iOS", note:"Free, no ads.", status:"done"},
  {title:"LokeWorks website launched", note:"Projects, assets, socials and more.", status:"done"},
  // {title:"Something I am building", note:"A short line about it.", status:"doing"},
  // {title:"Something coming later", note:"A short line about it.", status:"planned"},
];

/* ========= LOCKED / UNLOCKS =========
   Things that are finished, but only get released once a goal is reached.
   title:   what it is (or use hidden:true to show "???" instead)
   note:    short line about it
   goal:    what has to happen, e.g. "Beanbound reaches 1,000 downloads"
   current: where you are now (a number)
   target:  the number you need to reach
   unit:    optional label, e.g. "downloads"
   hidden:  true = keep the title a secret ("???")
   When current reaches target it shows as UNLOCKED automatically. */
var UNLOCKS = [
  {title:"Beanbound Moon", note:"Finished and ready, just waiting to be released.", goal:"5 players reach 100,000 m in Beanbound", current:1, target:5, unit:"players", hidden:false},
  // {title:"The finished thing", note:"Done and waiting.", goal:"Reach 1,000 downloads", current:250, target:1000, unit:"downloads", hidden:false},
];
</script>

<h1 class="page-h">Roadmap</h1>
<p class="sub">What I’m working on, what’s next, and what’s done.</p>
<div class="road" id="road"></div>
<div class="unlocks" id="unlocks" hidden>
<h2>Locked until a goal is hit</h2>
<p class="sub">These are finished. I’ll release them once the goal is reached.</p>
<div class="unlock-list" id="unlockList"></div>
</div>
</section></main>
<script>
(function(){
  var cols=[["doing","In progress"],["planned","Planned"],["done","Done"]];
  var root=document.getElementById("road");
  cols.forEach(function(c){
    var items=ROADMAP.filter(function(r){return r.status===c[0];});
    var col=document.createElement("div");col.className="road-col road-"+c[0];
    var h=document.createElement("h3");h.textContent=c[1];
    var n=document.createElement("span");n.className="road-count";n.textContent=items.length;h.appendChild(n);
    col.appendChild(h);
    if(!items.length){var p=document.createElement("p");p.className="road-empty";p.textContent="Nothing here yet.";col.appendChild(p);}
    items.forEach(function(r){
      var card=document.createElement("div");card.className="road-card";
      var t=document.createElement("strong");t.textContent=r.title;card.appendChild(t);
      if(r.note){var d=document.createElement("p");d.textContent=r.note;card.appendChild(d);}
      col.appendChild(card);
    });
    root.appendChild(col);
  });

  if(UNLOCKS.length){
    var box=document.getElementById("unlocks");
    box.hidden=false;
    var list=document.getElementById("unlockList");
    UNLOCKS.forEach(function(u){
      var cur=Number(u.current)||0,tar=Number(u.target)||1;
      var pct=Math.max(0,Math.min(100,Math.round(cur/tar*100)));
      var open=cur>=tar;
      var card=document.createElement("div");card.className="unlock-card"+(open?" is-open":"");
      var top=document.createElement("div");top.className="unlock-top";
      var t=document.createElement("strong");
      t.textContent=(u.hidden&&!open)?"???":u.title;
      var badge=document.createElement("span");badge.className="unlock-badge";badge.textContent=open?"UNLOCKED":"LOCKED";
      top.appendChild(t);top.appendChild(badge);card.appendChild(top);
      if(u.note&&!(u.hidden&&!open)){var d=document.createElement("p");d.textContent=u.note;card.appendChild(d);}
      if(u.goal){var g=document.createElement("p");g.className="unlock-goal";g.textContent="Unlocks when: "+u.goal;card.appendChild(g);}
      var bar=document.createElement("div");bar.className="unlock-bar";
      bar.setAttribute("role","progressbar");bar.setAttribute("aria-valuemin","0");bar.setAttribute("aria-valuemax",String(tar));bar.setAttribute("aria-valuenow",String(Math.min(cur,tar)));
      var fill=document.createElement("div");fill.className="unlock-fill";fill.style.width=pct+"%";bar.appendChild(fill);card.appendChild(bar);
      var n=document.createElement("p");n.className="unlock-num";
      n.textContent=cur.toLocaleString()+" / "+tar.toLocaleString()+(u.unit?" "+u.unit:"")+" ("+pct+"%)";
      card.appendChild(n);
      list.appendChild(card);
    });
  }
})();
</script></body></html>
